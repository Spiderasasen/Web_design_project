<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="styles/home_page.css" type="text/css">
    <link rel="stylesheet" href="styles/main.css" type="text/css">
</head>
<body>
<!--for navigation-->
    <header>
        <img class="image" src="assets/github-6980894_640.png" alt="GitHub Logo">
        <div class="nav_points">
            <nav>
                <span>Home</span>
                <span>Your Heat Map</span>
                <span>Your top repositories</span>
                <span>Your top languages</span>
            </nav>
        </div>
    </header>

    <main>
        <div class="login">
            <h1>Welcome to your GitHub actions</h1>
            <div class="login_elements">
                <div class="username">
                    <p>Please enter your username</p>
                    <input class="login_elements_input" type="text" placeholder="Username">
                </div>
                <div class="password">
                    <p>Please enter your password</p>
                    <input class="login_elements_input" type="password" placeholder="Password">
                </div>
                <button class="login_elements_button">Login</button>
            </div>
        </div>
    </main>
</body>
</html>
